<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 岩笋 · Rock Sprout 应用图标（草稿）
       原则：尖不圆、哑光不发亮、矿琥珀主色；缩到 32px 仍能认出是"从岩里冒出来的笋"。
       纯色块，不用渐变和阴影——小尺寸下渐变会糊成一片。 -->
  <rect width="1024" height="1024" fill="#0a0f14"/>
  <rect x="24" y="24" width="976" height="976" fill="none" stroke="#22303d" stroke-width="8"/>

  <!-- 岩层底座：两条横向的岩面，给笋一个"长出来"的交代 -->
  <rect x="120" y="796" width="784" height="14" fill="#16202a"/>
  <rect x="200" y="826" width="624" height="10" fill="#22303d"/>

  <!-- 笋身：尖顶、下宽，哑光矿琥珀 -->
  <path d="M512 132
           C 610 286 686 470 690 690
           L 692 786
           Q 692 800 678 800
           L 346 800
           Q 332 800 332 786
           L 334 690
           C 338 470 414 286 512 132 Z"
        fill="#f0a93c"/>

  <!-- 三道节：不是装饰，是让"笋"这个形状在 32px 时仍能读出层次 -->
  <path d="M352 430 Q 512 470 672 430 L 678 470 Q 512 512 346 470 Z" fill="#c98628"/>
  <path d="M340 596 Q 512 636 684 596 L 688 636 Q 512 678 336 636 Z" fill="#c98628"/>
  <path d="M334 742 L 690 742 L 690 772 L 334 772 Z" fill="#c98628"/>

  <!-- 右侧一道高光：不发亮，只是让左侧显得是背光面 -->
  <path d="M596 190 C 640 330 668 500 670 690 L 640 690 C 638 500 616 330 570 200 Z" fill="#ffc766" opacity="0.55"/>

  <!-- 左下角一块晶体：呼应 DRG 的水晶，仅在大尺寸可辨，小尺寸退成一点蓝 -->
  <path d="M214 700 L 258 700 L 272 762 L 250 796 L 222 796 L 200 762 Z" fill="#55c8f0" opacity="0.85"/>
</svg>
