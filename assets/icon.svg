<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 岩笋 · Rock Sprout 应用图标（草稿 v3）
       原则：尖不圆、哑光不发亮、矿琥珀主色。
       纯色块，无渐变/阴影/高光。
       节纹做成向上的 V 形（笋箨的边），不是横条——横条会读成火箭条纹。 -->
  <defs>
    <clipPath id="shoot">
      <path d="M512 128
               C 566 258 606 396 626 534
               C 646 658 668 730 700 812
               L 324 812
               C 356 730 378 658 398 534
               C 418 396 458 258 512 128 Z"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="#0a0f14"/>
  <rect x="22" y="22" width="980" height="980" fill="none" stroke="#22303d" stroke-width="10"/>

  <!-- 岩层 -->
  <rect x="150" y="812" width="724" height="18" fill="#16202a"/>
  <rect x="238" y="848" width="548" height="12" fill="#22303d"/>

  <!-- 笋身 -->
  <path d="M512 128
           C 566 258 606 396 626 534
           C 646 658 668 730 700 812
           L 324 812
           C 356 730 378 658 398 534
           C 418 396 458 258 512 128 Z"
        fill="#f0a93c"/>

  <!-- 两道 V 形节：裁在笋身内，两端不戳出轮廓 -->
  <g clip-path="url(#shoot)">
    <path d="M250 600 L512 540 L774 600 L774 636 L512 576 L250 636 Z" fill="#c98628"/>
    <path d="M250 730 L512 682 L774 730 L774 760 L512 712 L250 760 Z" fill="#c98628"/>
  </g>
</svg>
