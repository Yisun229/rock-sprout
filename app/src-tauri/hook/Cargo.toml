[package]
name = "hook"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "从 mint（提交 57aa964）搬来的游戏内加载器 DLL，建成后改名成 x3daudio1_7.dll 放进游戏目录"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.99"
repak = { git = "https://github.com/trumank/repak", rev = "96410d664ac46c87cf451a3c5bad38d8cf42dda5" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
fs-err = "3.1.1"
tracing = { version = "0.1.41", features = ["attributes"] }
patternsleuth = { git = "https://github.com/trumank/patternsleuth", rev = "5786164189604fd55f647aa38ef0bfd6f23f7d58", features = [
  "process-internal",
  "image-pe",
] }
retour = { git = "https://github.com/Hpmason/retour-rs", rev = "3bab630e234528e848c6c4e0a81656d262224579", features = ["static-detour"] }
hook_resolvers = { path = "../hook_resolvers" }
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_System_SystemServices",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Threading",
] }
mint_lib = { path = "../mint_lib" }
bitflags = "2.9.3"
widestring = "1.2.0"
tokio = { version = "1.47.1", features = ["full"] }
tracing-appender = "0.2.3"
proxy_dll = { git = "https://github.com/trumank/proxy_dll.git", rev = "a0c0772634ee751b580f95dd96c460885c8bdf2b" }
