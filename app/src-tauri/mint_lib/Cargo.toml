[package]
name = "mint_lib"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "从 mint（https://github.com/trumank/mint，提交 57aa964）搬来的游戏安装识别与 mod 元数据定义"

[dependencies]
anyhow = "1.0.99"
fs-err = "3.1.1"
itertools = "0.14.0"
snafu = "0.8.7"
steamlocate = "2.0.1"
serde = { version = "1.0.219", features = ["derive"] }
tracing = { version = "0.1.41", features = ["attributes"] }
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter", "std", "registry"] }
